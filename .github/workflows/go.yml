name: Go

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        working-directory: ./app
        run: go mod download

      - name: Test
        working-directory: ./app
        run: go test -v ./...

      - name: Build
        working-directory: ./app
        run: go build -v .

      - name: Validate add-on
        uses: hassio-addons/action@master
        with:
          addon: mqtt2escpos
          validate: true 