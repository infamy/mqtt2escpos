name: "MQTT to ESC/POS Printer Bridge"
description: "Bridge MQTT messages to ESC/POS thermal printers for Home Assistant integration"
version: "0.0.4"
icon: "icon.png"
slug: "mqtt2escpos"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
init: false
watchdog: "http://[HOST]:[PORT:8099]/health"
services:
  - mqtt:want
options:
  mqtt_broker: "core-mosquitto"
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic: "printer/commands"
  printer_host: "192.168.7.25"
  printer_port: "9100"
  printer_profile: "TM-T88VI"
  image_timeout: 30
  max_image_size: 1048576
  ha_discovery: true
  status_interval: 60
schema:
  mqtt_broker: str
  mqtt_username: str
  mqtt_password: password
  mqtt_topic: str
  printer_host: str
  printer_port: str
  printer_profile: str
  image_timeout: int
  max_image_size: int
  ha_discovery: bool
  status_interval: "int(10,)" 